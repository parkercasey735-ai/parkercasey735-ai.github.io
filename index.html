<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root{--ink:#0a0a0c;--paper:#faf9f7;--surface:#f2f2f0;--accent:#c41e3a;--muted:#6e6e78;--line:#e5e4e0;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
body{background:var(--paper);color:var(--ink);line-height:1.6;}
header{background:var(--ink);color:#fff;padding:5rem 6vw 6rem;position:relative;overflow:hidden;}
header::before{content:'';position:absolute;top:-30%;right:-15%;width:600px;height:600px;background:radial-gradient(circle,rgba(196,30,58,.22),transparent 70%);border-radius:50%;pointer-events:none;}
.header-inner{max-width:1200px;margin:0 auto;position:relative;z-index:1;}
.header-inner h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:3.8rem;letter-spacing:-.04em;line-height:1.05;margin-bottom:1rem;}
.header-inner h1 span{color:var(--accent);font-style:italic;font-weight:400;}
.tagline{color:#999;font-size:1.05rem;font-weight:300;max-width:560px;}
nav{max-width:1200px;margin:0 auto;padding:1.2rem 6vw;background:rgba(250,249,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;display:flex;gap:2.2rem;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
nav a{color:var(--muted);text-decoration:none;transition:color .2s;}nav a:hover{color:var(--ink);}
main{max-width:1200px;margin:0 auto;padding:5rem 6vw 12rem;}
.section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:600;margin-bottom:2rem;}
.posts{display:flex;flex-direction:column;gap:0;}
.post-card{display:grid;grid-template-columns:1fr 280px;gap:4rem;padding:3.5rem 0;border-bottom:1px solid var(--line);align-items:start;transition:background .2s;}
.post-card:first-of-type{padding-top:0;}
.post-card:hover{background:rgba(0,0,0,.005);}
.post-card h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.1rem;line-height:1.15;letter-spacing:-.02em;margin-bottom:.9rem;}
.post-card h2 a{color:inherit;text-decoration:none;}
.post-card p{color:#555;font-size:.95rem;line-height:1.7;max-width:640px;}
.meta{font-size:.75rem;color:#999;text-transform:uppercase;letter-spacing:.08em;line-height:1.7;}
.meta .tags span{display:inline-block;margin-top:.6rem;padding:.2rem .5rem;background:var(--surface);border:1px solid var(--line);border-radius:4px;color:var(--ink);font-size:.7rem;margin-right:.3rem;text-transform:none;letter-spacing:normal;}
.author{margin-top:.5rem;color:#888;}
footer{border-top:1px solid var(--line);padding:4rem 6vw;text-align:center;color:#999;font-size:.82rem;background:#f6f6f4;}
@media(max-width:880px){.post-card{grid-template-columns:1fr;gap:1.2rem;}.header-inner h1{font-size:2.4rem;}}
</style>

<body>
<header>
  <div class="header-inner">
    <h1><a href="./" style="color:inherit;text-decoration:none;">Agentic <span>Signal</span></a></h1>
    <p class="tagline">Marketing intelligence at the speed of AI. Strategy, execution, and the signals that actually move markets.</p>
  </div>
</header>
<nav><a href="./">Latest</a><a href="topics.html">Topics</a><a href="about.html">About</a></nav>
<main>
  <div class="section-label" id="sectionLabel">Latest Intelligence</div>
  <section class="posts" id="posts"></section>
<div id="pagination" style="display:flex;justify-content:center;gap:1rem;padding:2rem 0;font-family:'Inter',system-ui;font-size:.85rem;color:#777;align-items:center;"><button onclick="changePage(-1)" id="prevBtn" style="background:#0a0a0c;color:#fff;border:none;padding:.5rem 1rem;border-radius:4px;cursor:pointer;font-size:.8rem;opacity:1;">Previous</button><span id="pageInfo">Page 1 of 4</span><button onclick="changePage(1)" id="nextBtn" style="background:#0a0a0c;color:#fff;border:none;padding:.5rem 1rem;border-radius:4px;cursor:pointer;font-size:.8rem;opacity:1;">Next</button></div>
</main>
<footer>Agentic Signal — Professional marketing intelligence. Built for operators.</footer>
<script>
let allPosts=[];let currentPage=1;const perPage=5;const urlParams=new URLSearchParams(window.location.search);const topicFilter=urlParams.get('topic')||'';
fetch('posts.json').then(r=>r.json()).then(data=>{
  allPosts=topicFilter?data.posts.filter(p=>p.tags.includes(topicFilter)):data.posts;
  renderPage();
});
function renderPage(){
  const c=document.getElementById('posts');c.innerHTML='';
  const start=(currentPage-1)*perPage;const end=start+perPage;
  allPosts.slice(start,end).forEach(p=>{
    c.insertAdjacentHTML('beforeend',`
      <article class="post-card">
        <div><h2><a href="#">${p.title}</a></h2><p>${p.excerpt}</p></div>
        <aside class="meta">
          <div>${p.date} · <span style="color:#aaa;">${p.readTime}</span></div>
          <div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div>
          <div class="author">By ${p.author}</div>
        </aside>
      </article>`);
  });
  document.getElementById('sectionLabel').textContent=topicFilter?'Topic: '+topicFilter:'Latest Intelligence';
  const totalPages=Math.ceil(allPosts.length/perPage);
  document.getElementById('pageInfo').textContent=`Page ${currentPage} of ${totalPages}`;
  document.getElementById('prevBtn').disabled=currentPage===1;document.getElementById('prevBtn').style.opacity=currentPage===1?'0.4':'1';
  document.getElementById('nextBtn').disabled=currentPage===totalPages;document.getElementById('nextBtn').style.opacity=currentPage===totalPages?'0.4':'1';
}
function changePage(dir){currentPage+=dir;if(currentPage<1)currentPage=1;const totalPages=Math.ceil(allPosts.length/perPage);if(currentPage>totalPages)currentPage=totalPages;renderPage();}
</script>
